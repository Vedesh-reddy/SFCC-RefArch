draw.how=To verify: the entry list hash is SHA-256 of the downloaded file. For draw k, compute HMAC-SHA256 with the seed as key over "<entry list hash>:<counter>", take the first 13 hex characters as a number x, and skip the counter while x >= floor(2^52 / W) * W, where W is the total chances still in the pool. The winning entry is the one whose cumulative chance range holds x mod W; all entries of that participant then leave the pool.

