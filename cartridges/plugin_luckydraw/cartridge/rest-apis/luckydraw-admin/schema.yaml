  /executions/{executionId}/verification:
    get:
      operationId: verifyExecution
      summary: Recompute a draw from its snapshot and seed
      parameters:
        - $ref: '#/components/parameters/siteId'
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
