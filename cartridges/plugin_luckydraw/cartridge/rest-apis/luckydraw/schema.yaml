            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - ShopperToken:
            - c_luckydraw
  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
