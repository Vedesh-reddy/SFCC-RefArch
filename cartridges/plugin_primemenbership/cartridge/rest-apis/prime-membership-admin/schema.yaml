openapi: 3.0.3
info:
  title: Prime Membership Admin API
  version: 1.0.0
components:
  securitySchemes:
    AmOAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://account.demandware.com/dwsso/oauth2/access_token
          scopes:
            c_prime_membership_admin: Prime Membership back-office integration
  parameters:
    siteId:
      name: siteId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    c_limit:
      name: c_limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    planId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 42
    customerNo:
      name: customerNo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  schemas:
    Body:
      type: object
    Result:
      type: object
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
paths:
  /memberships/{customerNo}:
    get:
      operationId: getMembership
      summary: One membership
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/customerNo'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - AmOAuth2:
            - c_prime_membership_admin
  /memberships/{customerNo}/refunds:
    post:
      operationId: recordRefund
      summary: Record a refund made in the payment system
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/customerNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - AmOAuth2:
            - c_prime_membership_admin
  /transactions/review:
    get:
      operationId: listReviewTransactions
      summary: Payments held for review
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/c_limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - AmOAuth2:
            - c_prime_membership_admin
