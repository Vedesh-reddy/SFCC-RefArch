openapi: 3.0.3
info:
  title: Marketplace Shopper API
  version: 1.0.0
components:
  securitySchemes:
    ShopperToken:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{shortCode}.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/{organizationId}/oauth2/token
          scopes:
            c_mkt_shopper: Read marketplace offers and seller profiles
            c_mkt_seller: Seller self-service
  parameters:
    siteId:
      name: siteId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    c_offset:
      name: c_offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    c_limit:
      name: c_limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    c_status:
      name: c_status
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
  schemas:
    Body:
      type: object
    Result:
      type: object
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
paths:
  /offers:
    get:
      operationId: getProductOffers
      summary: Ranked offers for a product
      parameters:
        - $ref: '#/components/parameters/siteId'
        - name: c_productId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/problem+json:
