  /settlements/{settlementId}/payout-result:
    post:
      operationId: postPayoutResult
      summary: Confirm or fail a payout
      parameters:
        - $ref: '#/components/parameters/siteId'
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
