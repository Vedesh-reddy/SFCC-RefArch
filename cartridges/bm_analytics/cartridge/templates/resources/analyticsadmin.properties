notice.disabled=Analytics is disabled on this site, or the site currency is not USD. No new data is collected.
notice.sampled=Collected from a {0}% sample of sessions. Event counts are not extrapolated; orders and revenue are complete.
notice.dropped={0} events were dropped (browser queue full, rate limit or paused collection), so event counts are lower than the real activity.
notice.truncated=The period has more data than one page view can read; figures shown are incomplete. Choose a shorter period.
notice.rankings-stored=Precomputed by the rankings job at {0} UTC, including catalog products without activity.
notice.rankings-live=Computed from the daily figures for this period. Catalog products without any activity appear only in the precomputed standard periods.
notice.categories=Every product counts in one category only (its primary category), so categories never add up to more than the site. Parent categories are not rolled up.
notice.funnel-sessions=Discovery steps count sessions and are step ratios, not a strict cohort; checkout steps count checkout attempts and are nested.
notice.funnel-events=Event volumes. Ratios between unrelated events are shown for orientation only.
notice.orders=From placed orders (the reconciliation job), by order day. Refunds and cancellations count on the order's day.
notice.search-disabled=Search tracking is disabled (analyticsSearchTrackingEnabled).
notice.export=Downloads use the selected period. Text that could be read as a spreadsheet formula is prefixed with a quote.

error.invalid-date=The custom dates are not valid (yyyy-MM-dd); showing the last 7 days.
error.invalid-order=The start date is after the end date; showing the last 7 days.
error.range-too-long=Custom ranges can be at most 366 days; showing the last 7 days.
error.product-range=Product, category and ranking reports cover at most 93 days. Choose a shorter period.
error.product=Unknown product ID.
