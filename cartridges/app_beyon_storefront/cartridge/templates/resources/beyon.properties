faq.1.tag=IS IT REAL?
faq.1.q=Are laboratory-grown diamonds real?
faq.1.a=Yes. Laboratory\u2011grown diamonds are pure carbon diamonds with the same brilliance, hardness and structure as mined diamonds\u2014only the origin is different.
faq.2.tag=NEXT DAY DELIVERY
faq.2.q=How long does delivery take?
faq.2.a=Orders placed before 12PM from metros are delivered by the next day. Standard delivery for other locations takes 2-7 business days.
faq.3.tag=CERTIFICATION
faq.3.q=What is your authenticity certificate?
faq.3.a=Authenticity certificate by Titan Company confirms your jewellery's key specs like laboratory-grown diamond details and a unique SKU ID, so you know exactly what you purchased.
faq.4.tag=BIS/HUID HALLMARK - GOLD
faq.4.q=What does gold hallmark mean?
faq.4.a=Hallmarking verifies gold purity and identification (like BIS/HUID where applicable). It confirms the metal, not the diamond. Laboratory-grown diamond details are covered in the authenticity certificate by Titan Company.
faq.5.tag=LGD IS NOT CZ
faq.5.q=Is it the same as CZ?
faq.5.a=No. Cubic zirconia and moissanite are simulants. Laboratory\u2011grown diamonds are real diamonds made of carbon and test like mined diamonds for hardness and sparkle.
faq.6.tag=NO FADING
faq.6.q=Do LGDs fade over time?
faq.6.a=No. Their color and sparkle are intrinsic to the crystal, not a coating. With normal wear and cleaning, they retain brilliance like mined diamonds.
faq.7.tag=INCLUSIONS
faq.7.q=Are laboratory-grown diamonds always flawless?
faq.7.a=Not always. Like mined diamonds, laboratory\u2011grown diamonds can have inclusions from the growth process. Quality details are shared so you know the exact grade.
faq.8.tag=GOLD KARAT
faq.8.q=What does 14kt vs 18kt mean?
faq.8.a=It's gold purity: 14kt is 58.5% gold, 18kt is 75%. Choose 18kt for richer colour, 14kt for stronger daily wear.
faq.9.tag=RETURNS & EXCHANGES
faq.9.q=What is the return policy for jewellery?
faq.9.a=Returns are accepted within 7 days for unworn items in their original packaging. Custom and engraved pieces are non-returnable.
